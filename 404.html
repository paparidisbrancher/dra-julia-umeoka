<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | Dra. Julia Umeoka</title>
<meta name="theme-color" content="#FFFCFA">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
@font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('fonts/manrope-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-display: swap; src: url('fonts/newsreader-italic-latin.woff2') format('woff2'); }
@font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400 500; font-display: swap; src: url('fonts/newsreader-normal-latin.woff2') format('woff2'); }
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#FFFCFA;color:#2F3545;font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-align:center}
main{max-width:32em;display:flex;flex-direction:column;align-items:center;gap:20px}
p{margin:0}
.badge{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#9BA2CE}
.badge img{display:block;height:40px;width:auto}
.rotulo{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#2F3545}
h1{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1.05;letter-spacing:-.022em}
h1 em{font-style:italic;color:#BB4468}
.texto{color:#4A5062}
a{margin-top:4px;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:#3D5275;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none;transition:background-color 180ms ease}
a:hover{background:#2C3D5A}
a:focus-visible{outline:3px solid #3D5275;outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="badge" aria-hidden="true"><img src="assets/ursinho-recorte.png" alt="" width="170" height="230"></span>
  <p class="rotulo">Dra. Julia Umeoka · Pediatra em Muriaé</p>
  <h1>Página <em>não encontrada.</em></h1>
  <p class="texto">O endereço pode ter mudado. Volte ao início para conhecer o acompanhamento pediátrico ou falar com a equipe.</p>
  <a href="./">Voltar ao site</a>
</main>
</body>
</html>
